name: Postman API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  newman:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Newman
        run: npm ci

      - name: Run collection
        run: npm test

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: newman-report
          path: reports/
          retention-days: 14
